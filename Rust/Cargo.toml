[package]
name = "goto-engine"
version = "3.2.0"
edition = "2021"
authors = ["GOTO Engine Team"]
license = "AGPL-3.0-or-later"
description = "GOTO Engine — local-first smart search & intent engine (Rust port of goto-engine.js v3.2.0)"
repository = "https://github.com/your-org/goto-engine-rust"
homepage = "https://github.com/your-org/goto-engine-rust"
documentation = "https://github.com/your-org/goto-engine-rust"
readme = "README.md"
keywords = ["search", "intent", "fuzzy", "engine", "launcher"]
categories = ["algorithms", "data-structures", "text-processing"]
exclude = [
    ".github/*",
    "tests/fixtures/*",
]

[lib]
name = "goto_engine"
path = "src/lib.rs"

[features]
default = ["std", "semantic"]
# 启用标准库（默认）。关闭后进入 no_std 模式（spin 自旋锁 + alloc）。
std = ["regex/std"]
# 启用语义联想模块（L1/L2/L3）。关闭后仅使用核心引擎。
semantic = []
# 启用 WASM 绑定（需要 wasm32 target + wasm-bindgen）
wasm = []
# 启用 JSON Schema 校验（开发用）
strict = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = { version = "1.10", default-features = false, features = ["std"] }
lru = "0.12"
once_cell = "1.19"
thiserror = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# no_std 下的 RwLock 实现（spin 自旋锁）。std 模式下不使用，但保留以便统一依赖。
spin = { version = "0.9", default-features = false, features = ["rwlock"] }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 1

[[bench]]
name = "search_bench"
harness = false
path = "benches/search_bench.rs"

[package.metadata.docs.rs]
all-features = true
